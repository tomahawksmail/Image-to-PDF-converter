<!DOCTYPE html>
<html>
<head>
    <title>USKO pdf converter</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">

    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>

<body>

<div class="page">

    <div class="hero">
        <h1>USKO PDF CONVERTER</h1>
    </div>

    <div class="center-area">
        <div class="container">

            <div class="content">

                <label class="upload-box">
                    <input type="file" id="fileInput" multiple accept=".png,.jpg,.jpeg,.webp,.pdf">
                    <span>Click or drop files here</span>
                </label>

                <div id="previewList" class="preview-grid"></div>

                <div class="options">

                    <span class="option-label">Fit to A4</span>

                    <label class="switch">
                        <input type="checkbox" name="fit_a4" checked>
                        <span class="slider"></span>
                    </label>

                </div>

                <div class="options">

                    <span class="option-label">Compress PDF</span>

                    <label class="switch">
                        <input type="checkbox" name="compress" id="compressCheckbox">
                        <span class="slider"></span>
                    </label>

                </div>

                <div class="options" id="qualityOptions" style="display: none;">

                    <span class="option-label">
                        Quality: <span id="qualityValue">35</span>%
                    </span>

                    <input
                        type="range"
                        id="qualitySlider"
                        name="compress_quality"
                        min="10"
                        max="95"
                        value="35"
                    >

                </div>

                <div class="options">

                    <span class="option-label">One file as result</span>

                    <label class="switch">
                        <input type="checkbox" name="single_result" id="singleResultCheckbox" checked>
                        <span class="slider"></span>
                    </label>

                </div>

            </div>

            <button id="convertBtn" disabled>Convert</button>

        </div>
    </div>

    <div class="hero">
        <h4>Coded by USKO IT Team, 2026</h4>

        <div id="counter">
            Processed: 0 | Total: 0
        </div>

        <br>

        <div>
            App version: 3.1.0
        </div>
    </div>

</div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    const input = document.getElementById("fileInput");
    const previewList = document.getElementById("previewList");
    const convertBtn = document.getElementById("convertBtn");

    const compressCheckbox = document.getElementById("compressCheckbox");
    const qualityOptions = document.getElementById("qualityOptions");
    const qualitySlider = document.getElementById("qualitySlider");
    const qualityValue = document.getElementById("qualityValue");

    const singleResultCheckbox = document.getElementById("singleResultCheckbox");

    let items = [];
    let sortableInstance = null;

    // ==========================
    // UPDATE BUTTON STATE
    // ==========================
    function updateButtonState() {
        const hasFiles = items.length > 0;
        convertBtn.disabled = !hasFiles;
    }

    // ==========================
    // QUALITY SLIDER SHOW / HIDE
    // ==========================
    function updateQualityVisibility() {
        qualityOptions.style.display = compressCheckbox.checked ? "flex" : "none";
    }

    compressCheckbox.addEventListener("change", updateQualityVisibility);

    qualitySlider.addEventListener("input", () => {
        qualityValue.innerText = qualitySlider.value;
    });

    // ==========================
    // FILE HANDLING
    // ==========================
    input.addEventListener("change", handleFiles);

    function createId() {
        if (window.crypto && crypto.randomUUID) {
            return crypto.randomUUID();
        }

        return Date.now().toString() + Math.random().toString(16).slice(2);
    }

    async function handleFiles(e) {
        const files = Array.from(e.target.files || []);

        items.forEach(item => {
            if (item.previewUrl) {
                URL.revokeObjectURL(item.previewUrl);
            }
        });

        items = [];
        previewList.innerHTML = "";

        for (let file of files) {
            const obj = {
                id: createId(),
                file: file,
                rotation: 0,
                previewUrl: null
            };

            items.push(obj);

            const card = document.createElement("div");
            card.className = "preview-card";
            card.dataset.id = obj.id;

            // DELETE BUTTON
            const del = document.createElement("button");
            del.className = "delete-btn";
            del.innerText = "✕";

            del.onclick = (ev) => {
                ev.preventDefault();

                if (obj.previewUrl) {
                    URL.revokeObjectURL(obj.previewUrl);
                }

                items = items.filter(i => i.id !== obj.id);
                card.remove();

                updateButtonState();
            };

            // ROTATE BUTTON
            const rot = document.createElement("button");
            rot.className = "rotate-btn";
            rot.innerText = "⟳";

            let preview;

            rot.onclick = (ev) => {
                ev.preventDefault();

                obj.rotation = (obj.rotation + 90) % 360;
                preview.style.transform = `rotate(${obj.rotation}deg)`;
            };

            // PREVIEW
            if (file.type.startsWith("image/")) {
                preview = document.createElement("img");

                obj.previewUrl = URL.createObjectURL(file);
                preview.src = obj.previewUrl;

            } else if (file.type === "application/pdf" || file.name.toLowerCase().endsWith(".pdf")) {
                preview = document.createElement("canvas");

                const pdfData = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: pdfData }).promise;
                const page = await pdf.getPage(1);

                const viewport = page.getViewport({ scale: 0.4 });
                const ctx = preview.getContext("2d");

                preview.width = viewport.width;
                preview.height = viewport.height;

                await page.render({
                    canvasContext: ctx,
                    viewport: viewport
                }).promise;

            } else {
                continue;
            }

            card.appendChild(del);
            card.appendChild(rot);
            card.appendChild(preview);

            previewList.appendChild(card);
        }

        if (sortableInstance) {
            sortableInstance.destroy();
        }

        sortableInstance = new Sortable(previewList, {
            animation: 150,

            onEnd: () => {
                const newOrder = [];

                for (let card of previewList.children) {
                    const id = card.dataset.id;
                    const foundItem = items.find(item => item.id === id);

                    if (foundItem) {
                        newOrder.push(foundItem);
                    }
                }

                items = newOrder;
            }
        });

        updateButtonState();
    }

    // ==========================
    // GET FILENAME FROM RESPONSE
    // ==========================
    function getFilenameFromResponse(res, fallbackName) {
        const disposition = res.headers.get("Content-Disposition");

        if (!disposition) {
            return fallbackName;
        }

        const match = disposition.match(/filename="?([^"]+)"?/);

        if (match && match[1]) {
            return match[1];
        }

        return fallbackName;
    }

    // ==========================
    // CONVERT PDF
    // ==========================
    convertBtn.onclick = async () => {
        if (items.length === 0) return;

        const formData = new FormData();

        items.forEach(item => {
            formData.append("files", item.file);
            formData.append("rotations", item.rotation);
        });

        document.querySelectorAll("input[type=checkbox]").forEach(cb => {
            formData.append(cb.name, cb.checked ? "on" : "off");
        });

        formData.append("compress_quality", qualitySlider.value);

        convertBtn.disabled = true;
        convertBtn.innerText = "Converting...";

        try {
            const res = await fetch("/convert", {
                method: "POST",
                body: formData
            });

            if (!res.ok) {
                const errorText = await res.text();
                alert(errorText || "Conversion failed.");
                return;
            }

            const processed = res.headers.get("X-Files-Processed") || "0";
            const total = res.headers.get("X-Total-Files") || "0";

            document.getElementById("counter").innerText =
                `Processed: ${processed} | Total: ${total}`;

            const blob = await res.blob();
            const url = URL.createObjectURL(blob);

            const fallbackName = singleResultCheckbox.checked
                ? "output.pdf"
                : "converted_files.zip";

            const filename = getFilenameFromResponse(res, fallbackName);

            const a = document.createElement("a");
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();

            URL.revokeObjectURL(url);

        } catch (error) {
            console.error(error);
            alert("Conversion error.");

        } finally {
            convertBtn.innerText = "Convert";
            updateButtonState();
        }
    };

    // ==========================
    // DRAG & DROP SUPPORT
    // ==========================
    const dropZone = document.querySelector(".upload-box");

    dropZone.addEventListener("dragover", (e) => {
        e.preventDefault();
        dropZone.classList.add("dragover");
    });

    dropZone.addEventListener("dragleave", () => {
        dropZone.classList.remove("dragover");
    });

    dropZone.addEventListener("drop", (e) => {
        e.preventDefault();
        dropZone.classList.remove("dragover");

        input.files = e.dataTransfer.files;
        handleFiles({ target: input });
    });

    // init state
    updateButtonState();
    updateQualityVisibility();
</script>

</body>
</html>
